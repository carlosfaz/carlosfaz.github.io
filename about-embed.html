<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sobre mí</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: auto;
            background: #f5f5f5;
        }

        .svg-container {
            width: 100vw;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            background: #f5f5f5;
            overflow: auto;
            padding: 20px;
        }

        .svg-container object {
            width: 80%;
            height: auto;
            min-width: 80%;
            transform: scale(0.8);
            transform-origin: top center;
            max-width: 100%;
        }
    </style>
</head>
<body>
    <div class="svg-container">
        <object data="new-aboutme.svg" type="image/svg+xml">
            <p>Tu navegador no soporta SVG. Por favor, actualiza tu navegador.</p>
        </object>
    </div>
</body>
</html>
