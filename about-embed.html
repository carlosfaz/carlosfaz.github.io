<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sobre mí</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            /* Cambiado de hidden a auto para permitir el scroll */
            overflow: auto; 
            background: #f5f5f5;
        }
        
        .svg-container {
            /* 200vw y 200vh hacen que el contenedor mida el doble de la pantalla (Zoom 200%) */
            width: 200vw;
            height: 200vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f5f5;
        }
        
        .svg-container img {
            /* La imagen ocupará el 100% de su contenedor gigante */
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <div class="svg-container">
        <!-- Cambiado a etiqueta <img> para mejor control del scroll y escalado -->
        <img src="new-aboutme.svg" alt="Sobre mí">
    </div>
</body>
</html>
