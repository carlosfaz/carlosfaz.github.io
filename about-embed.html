<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Me - Carlos Faz</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .pdf-container {
            width: 100%;
            max-width: 900px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .pdf-container iframe {
            width: 100%;
            height: 100vh;
            min-height: 800px;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <div class="pdf-container">
        <iframe src="{{ site.baseurl }}/new-aboutme.pdf" title="About Me"></iframe>
    </div>
</body>
</html>
